# .github/workflows/test.yml - check the code on every push to main and on every pull request.
#
# The go jobs vet and test the Go code, as docker/test-go.sh does, without Docker. The Linux job covers every package,
# and checks first that each file is formatted as gofmt formats it. The Windows job covers the launcher and the
# packages it shares with the server: the launcher is a Windows program, and some of its tests run only there. The
# server is a Linux program and does not compile for Windows. Go's version is the one go.mod names.
#
# The page job checks the page's TypeScript, runs its tests and builds the page (web/), as the image's build does
# (docker/Dockerfile, stage web-build).
#
# The e2e job runs the page tests (e2e/), as docker/test-e2e.sh does, without Docker: it builds the server, the
# stand-in game and the page, and Playwright Test drives Chromium on the page. A failed run keeps the tests' results
# (screenshots, traces, logs) as an artifact.
#
# The tests with real games (docker/test-games.sh) do not run here, because they need the game files.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: ./...
          - os: windows-latest
            packages: ./launcher/... ./internal/... ./cmd/...
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # gofmt lists the files that it would format otherwise. The step fails when it lists any, and shows them.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          files=$(gofmt -l server launcher internal cmd e2e/standin)
          if [ -n "$files" ]; then
            echo "::error::gofmt would format these files otherwise (run gofmt -w on them): $(echo $files)"
            exit 1
          fi
      - run: go vet ${{ matrix.packages }}
      # setup-go keeps Go's build cache between runs, which also holds test results. -count=1 runs every test anyway.
      - run: go test -count=1 ${{ matrix.packages }}
      # The script that installs the launcher on a Mac (launcher/mac.sh): bash reads it through without running it.
      - if: matrix.os == 'ubuntu-latest'
        run: bash -n launcher/mac.sh
  page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: go build -o build/e2e/zombies-server ./server && go build -o build/e2e/standin ./e2e/standin
        env:
          CGO_ENABLED: 0
      - run: npm ci && npm run build
        working-directory: web
      - run: npm ci && npm run check && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: build/e2e/results
